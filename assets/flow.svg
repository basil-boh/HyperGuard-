<svg width="820" height="912" viewBox="0 0 820 912" xmlns="http://www.w3.org/2000/svg"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img"
     aria-label="HyperGuard swarm flow: a transfer is scored by the Digital Twin; low risk is approved instantly, high risk goes to the Voice Negotiator, Educator, Guardian and Arbiter, which either releases or blocks the transfer and hands a blocked case to the Recovery Coordinator.">
  <title>How the HyperGuard swarm decides</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4f5747"/>
    </marker>
  </defs>

  <rect width="820" height="912" rx="18" fill="#07080c"/>

  <!-- edges -->
  <g fill="none" stroke="#4f5747" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M470 76 V116"/>
    <path d="M470 180 V198 Q470 208 460 208 H160 Q150 208 150 218 V250"/>
    <path d="M470 180 V250"/>
    <path d="M470 314 V364"/>
    <path d="M470 428 V478"/>
    <path d="M470 542 V592"/>
    <path d="M610 396 H662 Q672 396 672 386 V292 Q672 282 662 282 H605"/>
    <path d="M470 656 V674 Q470 684 460 684 H320 Q310 684 310 694 V706"/>
    <path d="M470 656 V674 Q470 684 480 684 H620 Q630 684 630 694 V706"/>
    <path d="M630 770 V820"/>
  </g>

  <!-- edge labels -->
  <g fill="#8b9a7a" font-size="11.5">
    <text x="305" y="201" text-anchor="middle">risk under 0.58</text>
    <text x="482" y="220">risk 0.58 and up</text>
    <text x="682" y="343">counter-line</text>
  </g>

  <!-- 1. entry -->
  <rect x="355" y="28" width="230" height="48" rx="10" fill="#10131a" stroke="#2f3542" stroke-width="1.3"/>
  <text x="470" y="58" text-anchor="middle" fill="#cfd6e4" font-size="15" font-weight="600">Transfer authorised</text>

  <!-- 2. digital twin -->
  <rect x="305" y="116" width="330" height="64" rx="12" fill="#0b0f07" stroke="#c9f24a" stroke-width="1.4"/>
  <text x="470" y="142" text-anchor="middle" fill="#c9f24a" font-size="15" font-weight="600">Digital Twin</text>
  <text x="470" y="163" text-anchor="middle" fill="#97a882" font-size="12.5">scores it against her own baseline</text>

  <!-- 3. fast path (terminal, pass) -->
  <rect x="30" y="250" width="240" height="64" rx="12" fill="#c9f24a"/>
  <text x="150" y="276" text-anchor="middle" fill="#07080c" font-size="15" font-weight="700">Approved instantly</text>
  <text x="150" y="297" text-anchor="middle" fill="#33430b" font-size="12.5">she never knows we were there</text>

  <!-- 4. negotiator -->
  <rect x="335" y="250" width="270" height="64" rx="12" fill="#0b0f07" stroke="#c9f24a" stroke-width="1.4"/>
  <text x="470" y="276" text-anchor="middle" fill="#c9f24a" font-size="15" font-weight="600">Voice Negotiator</text>
  <text x="470" y="297" text-anchor="middle" fill="#97a882" font-size="12.5">calls her</text>

  <!-- 5. educator -->
  <rect x="330" y="364" width="280" height="64" rx="12" fill="#0b0f07" stroke="#c9f24a" stroke-width="1.4"/>
  <text x="470" y="390" text-anchor="middle" fill="#c9f24a" font-size="15" font-weight="600">Educator</text>
  <text x="470" y="411" text-anchor="middle" fill="#97a882" font-size="12.5">names the scam script</text>

  <!-- 6. guardian -->
  <rect x="320" y="478" width="300" height="64" rx="12" fill="#0b0f07" stroke="#c9f24a" stroke-width="1.4"/>
  <text x="470" y="504" text-anchor="middle" fill="#c9f24a" font-size="15" font-weight="600">Guardian</text>
  <text x="470" y="525" text-anchor="middle" fill="#97a882" font-size="12.5">wakes a trusted contact</text>

  <!-- 7. arbiter -->
  <rect x="305" y="592" width="330" height="64" rx="12" fill="#0b0f07" stroke="#c9f24a" stroke-width="1.4"/>
  <text x="470" y="618" text-anchor="middle" fill="#c9f24a" font-size="15" font-weight="600">Arbiter</text>
  <text x="470" y="639" text-anchor="middle" fill="#97a882" font-size="12.5">weighs it all, writes the rationale</text>

  <!-- 8. released (terminal, pass) -->
  <rect x="220" y="706" width="180" height="48" rx="10" fill="#c9f24a"/>
  <text x="310" y="736" text-anchor="middle" fill="#07080c" font-size="15" font-weight="700">Released</text>

  <!-- 9. blocked (terminal, halt) -->
  <rect x="505" y="706" width="250" height="64" rx="12" fill="#ff4d5e"/>
  <text x="630" y="732" text-anchor="middle" fill="#1a0409" font-size="15" font-weight="700">Blocked</text>
  <text x="630" y="753" text-anchor="middle" fill="#5c1017" font-size="12.5">money never leaves</text>

  <!-- 10. recovery -->
  <rect x="465" y="820" width="330" height="64" rx="12" fill="#17110a" stroke="#ffc24b" stroke-width="1.4"/>
  <text x="630" y="846" text-anchor="middle" fill="#ffc24b" font-size="15" font-weight="600">Recovery Coordinator</text>
  <text x="630" y="867" text-anchor="middle" fill="#bda079" font-size="12.5">evidence pack for bank + police</text>
</svg>
